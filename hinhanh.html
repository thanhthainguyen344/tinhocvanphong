<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>TIN HỌC VĂN PHÒNG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }
        header {
            background: pink;
            color: black;
            padding: 18px 7%;
            display: flex;
            justify-content: right;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .tieude{
            font-size: 28px;
            font-weight: bold;
        }
        .tieude span{
            color: red;
        }
        nav {
            display: flex;
            gap: 20px;
            background-color: white;
            box-shadow: 2px 5px 10px gray;
            
        }
        nav a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #38bdf8;
        }
        .trangchu {
            height: 550px;
            padding: 80px 7%;
            display: grid;
            align-items: center;
            gap: 50px;
        }
        .trangchu h1 {
            font-size: 60px;
            line-height: 1.1;
            color: #0f172a;
            margin: 15px 0;
        }
        .trangchu h1 span {
            color: #2563eb;
        }
        .trangchu p {
            font-size: 19px;
            color: #475569;
            width: 650px;
        }
        .bđ {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .bđ:hover {
            background: #1d4ed8;
            color: yellow;
        }       
        section {
            padding: 70px 7%;
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
        }
        .title h2 {
            font-size: 36px;
            color: #0f172a;
        }
        .anh {
            display: grid;
            grid-template-columns:auto auto auto;
            gap: 20px;
            
        }
        .anh img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
        }
        .anh img:hover {
            transform: scale(1.2);
        }  
        footer {
            background: pink;
            color: rgb(0, 0, 0);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
        }
    </style>
</head>
