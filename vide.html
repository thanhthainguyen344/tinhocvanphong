            margin: 0;

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }
        header {
            background: pink;
            color: black;
            padding: 18px 7%;
            display: flex;
            justify-content:right;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .tieude{

            background-color: white;
            box-shadow: 2px 5px 10px gray;

        nav a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #38bdf8;
        }     
        section {
            padding: 70px 7%;
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
        }
        .title h2 {
            font-size: 36px;
            color: #0f172a;
        }
        .video {
            width: 720px;
            margin: auto;
            padding: 10px;
            border-radius: 18px;
            grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
        }
        .video img {
            width: 80%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            box-shadow: 0px 5px 10px gray;
        }   
        footer {
            background: pink;
            color: rgb(0, 0, 0);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
        }
